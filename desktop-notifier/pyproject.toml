[project]
name = "mux-desktop-notifier"
version = "0.0.1"
description = "Optional desktop presenter for mux agent-session state"
requires-python = ">=3.8"
# Pillow EVERYWHERE, dbus-next ONLY WHERE THERE IS A BUS. render.py owns every
# pixel on every platform, so Pillow is not optional; dbus_next is imported by
# exactly one module (backend_dbus.py), so a platform with no D-Bus should not
# be made to carry it. The marker is what lets a macOS presenter be an
# ADDITION: `pip install` there resolves, and the shared half imports.
dependencies = [
  "Pillow>=9",
  "dbus-next>=0.2.3; sys_platform == 'linux'",
]

[project.scripts]
mux-desktop-notifier = "mux_desktop_notifier.__main__:main"

# EXPLICIT, not auto-discovered. setuptools' flat-layout heuristic happens to
# exclude a top-level `tests/`, but relying on a heuristic to keep test code
# out of an installed package is a silent failure waiting for the day the
# heuristic changes. One line, and the answer is stated.
[tool.setuptools]
packages = ["mux_desktop_notifier"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
